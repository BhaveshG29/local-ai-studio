name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and the tests on all four platforms (ci.yml) must pass before anything
  # is built, so a broken version is never published.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Apple Silicon builds use the GPU through Metal. Linux and Windows builds run the
      # built-in engine on the CPU: CUDA kernels are compiled for one card generation and
      # need the CUDA libraries, so GPU builds are made on the user's computer
      # (scripts/build.sh, scripts/build.ps1).
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="local-ai-studio-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/local-ai-studio"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          cp "$bin" README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md "$name/"
          cp config/local-ai-studio.example.toml "$name/"
          # Only the archive and its checksum are uploaded (from out/). Uploading the folder
          # they were made from too made the release step fail with "is a directory".
          mkdir out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "out/$name.zip" "$name" > /dev/null
            (cd out && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            tar czf "out/$name.tar.gz" "$name"
            (cd out && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        # A release for this tag may already exist (for example one written by hand on
        # github.com); then the archives are attached to it instead of failing.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Local AI Studio $GITHUB_REF_NAME" --generate-notes
          fi
