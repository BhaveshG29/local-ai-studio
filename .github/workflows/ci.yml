name: CI

# Not run on ordinary pushes. The release workflow runs these checks before it builds a new
# version, and they can be started by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI machines have no desktop keychain; secrets tests use the in-memory fallback.
  LOCAL_AI_STUDIO_NO_KEYCHAIN: "1"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check the build script
        run: bash -n scripts/build.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        # Tests that need real models, a GPU, Ollama or internet access are #[ignore]d;
        # see the "Testing" section of the README to run them locally.
        # --no-fail-fast: run every test file even after a failure, so one run shows them all.
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Start-up smoke test
        shell: bash
        run: cargo run --locked -- --system-info > system-info.json && cat system-info.json
      - name: Apple Silicon builds include Metal
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        run: |
          grep -q '"metal_compiled": true' system-info.json
      - name: Check the Windows build script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/build.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from `rust-version` in Cargo.toml, so the two never disagree.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "Minimum Rust version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  # Apple Silicon builds include Metal by default (tested above). On Intel Macs it's opt-in.
  metal-intel:
    name: Metal on Intel Macs (opt-in)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --features metal
